services:
  hcloud-dyndns:
    build:
      context: .
      network: host
    container_name: hcloud-dyndns-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CONFIG=/config/hcloud-dyndns.conf
      - INTERVAL=300
      - MODE=loop
      - AUTO_CREATE=1
      # optional:
      # - SCRIPT_FLAGS=--verbose
      - SCRIPT_FLAGS=--quiet
    network_mode: host
    volumes:
      - ./config:/config:ro
